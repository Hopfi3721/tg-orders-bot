[project]
name = "tg-orders-bot"
version = "0.1.0"
description = "Telegram-бот приёма заявок на aiogram 3: FSM-форма, SQLite, админ-панель, выгрузка в CSV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
