name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: install
        run: uv sync --locked

      - name: tests
        run: uv run pytest

      - name: byte-compile
        run: uv run python -m compileall -q app main.py
